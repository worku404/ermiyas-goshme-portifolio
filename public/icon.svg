<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD5E2F" />
      <stop offset="100%" stop-color="#8B3F1B" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE4" />
    </linearGradient>
  </defs>

  <!-- Background Terracotta Architectural Block -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#terracotta)" />
  <rect x="7" y="7" width="114" height="114" rx="25" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Subtle Blueprint Grid lines -->
  <line x1="20" y1="64" x2="108" y2="64" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="64" y1="20" x2="64" y2="108" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Architectural Monumental Portal & Monogram "EG" -->
  <!-- Outer Arch Portal Frame -->
  <path d="M30 96 V54 C30 35, 98 35, 98 54 V96" 
        fill="none" 
        stroke="url(#beamGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Structural "E" horizontal cantilevers -->
  <path d="M46 48 h22 M46 64 h18 M46 80 h22" 
        fill="none" 
        stroke="url(#beamGrad)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Structural "E" vertical column -->
  <path d="M46 42 v44" 
        fill="none" 
        stroke="url(#beamGrad)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Stylized "G" internal horizontal spur -->
  <path d="M82 66 H70 V80 H82" 
        fill="none" 
        stroke="url(#beamGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Keystone / Caliper Accent Jewel -->
  <circle cx="64" cy="27" r="4.5" fill="#FFDAA8" />
</svg>